name: Bug report
description: Report a broken page, bad link, incorrect example, or starter-pack issue.
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: What is broken?
      description: Describe the docs page, example, or workflow issue.
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: Affected path
      description: Markdown page, example path, starter-pack file, or workflow.
      placeholder: docs/pattern-library.md
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: verification
    attributes:
      label: Verification notes
      description: Include broken links, screenshots, or reproduction steps.
