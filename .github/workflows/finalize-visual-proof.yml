name: Finalize Visual Proof

on:
  push:
    branches: ['agent/final-visual-proof']
    paths:
      - '.github/workflows/finalize-visual-proof.yml'

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-visual-proof
      - name: Download validated visual artifact
        run: gh run download 31301450246 -n frontend-ai-patterns-public-proof -D /tmp/proof
      - name: Install final GIF and embed it
        shell: python
        run: |
          from pathlib import Path
          import shutil

          candidates = list(Path('/tmp/proof').rglob('trustworthy-ai-playground.gif'))
          if not candidates: raise SystemExit('Validated GIF missing from Actions artifact')
          target = Path('docs/assets/public-proof/trustworthy-ai-playground.gif')
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(candidates[0], target)
          if target.stat().st_size >= 8_000_000: raise SystemExit('GIF exceeds 8 MB')

          readme = Path('README.md')
          text = readme.read_text()
          needle = "- **See the design intent:** [Public Proof](docs/public-proof.md) gives a 30-second, 3-minute, and 15-minute review path plus the exact evidence matrix.\n\nThe playground demonstrates the full frontend lifecycle without provider credentials:"
          insert = "- **See the design intent:** [Public Proof](docs/public-proof.md) gives a 30-second, 3-minute, and 15-minute review path plus the exact evidence matrix.\n\n<p align=\"center\">\n  <img src=\"docs/assets/public-proof/trustworthy-ai-playground.gif\" alt=\"Trustworthy AI playground showing approval, missing evidence, tool failure, and stalled-stream retry\" width=\"960\" />\n</p>\n\n<p align=\"center\"><em>Real exact-branch capture: grounded approval boundary → no-evidence suppression → failed tool → stalled-stream retry with preserved safe context. Deterministic fixtures; no provider credentials or real automation.</em></p>\n\nThe playground demonstrates the full frontend lifecycle without provider credentials:"
          if 'trustworthy-ai-playground.gif' not in text:
              if needle not in text: raise SystemExit('README insertion point missing')
              readme.write_text(text.replace(needle, insert, 1))

          proof = Path('docs/public-proof.md')
          text = proof.read_text()
          needle = "## 30-second review\n\nOpen these four surfaces:"
          insert = "## 30-second review\n\n![Trustworthy AI playground lifecycle](assets/public-proof/trustworthy-ai-playground.gif)\n\nThe animation is generated from the exact Angular branch build at a 1440×900 recruiter viewport. It proves the approval boundary, evidence suppression, truthful tool failure, and stalled-stream retry while keeping the demo/mock boundary explicit.\n\nOpen these four surfaces:"
          if 'trustworthy-ai-playground.gif' not in text:
              if needle not in text: raise SystemExit('Public-proof insertion point missing')
              proof.write_text(text.replace(needle, insert, 1))

          Path('.github/workflows/finalize-visual-proof.yml').unlink()
      - name: Commit final asset and embeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Embed final trustworthy AI visual proof [skip ci]'
          git push origin HEAD:agent/final-visual-proof
