name: CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate docs links and starter packs
        run: npm run verify
