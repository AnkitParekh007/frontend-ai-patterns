name: CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate docs links and starter packs
        run: npm run verify

  validate-pattern-playground:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/ui-aware-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/ui-aware-agent/package-lock.json

      - name: Install playground dependencies
        run: npm ci

      - name: Run deterministic scenario tests
        run: npm test

      - name: Build Angular playground with Pages base href
        run: npm run build -- --configuration production --base-href /frontend-ai-patterns/playground/

      - name: Verify Pages-ready playground output
        run: test -f dist/ai-ui-agent-demo/browser/index.html
