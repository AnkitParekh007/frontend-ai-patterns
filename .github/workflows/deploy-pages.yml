name: Deploy GitHub Pages

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate docs and starter packs
        run: npm run verify

      - name: Install playground dependencies
        working-directory: examples/ui-aware-agent
        run: npm ci

      - name: Test deterministic playground scenarios
        working-directory: examples/ui-aware-agent
        run: npm test

      - name: Build playground for GitHub Pages
        working-directory: examples/ui-aware-agent
        run: npm run build -- --configuration production --base-href /frontend-ai-patterns/playground/

      - name: Assemble static docs site
        run: npm run build:site

      - name: Publish runnable playground into site artifact
        run: |
          rm -rf _site/playground
          mkdir -p _site/playground
          cp -R examples/ui-aware-agent/dist/ai-ui-agent-demo/browser/. _site/playground/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test published docs and playground
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 "$PAGE_URL" >/dev/null
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 "${PAGE_URL%/}/playground/" >/dev/null
