    <text x="325" y="330" font-size="17" fill="#334155">payload</text>

    <rect x="510" y="210" width="190" height="200" rx="24" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="540" y="276" font-size="25" font-weight="700" fill="#92400e">diagram.mmd</text>
