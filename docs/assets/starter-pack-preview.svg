<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#f7fafc"/>
  <rect x="40" y="40" width="1120" height="440" rx="28" fill="#ffffff" stroke="#d8e0ea" stroke-width="2"/>
