  <text x="80" y="150" font-family="Segoe UI, sans-serif" font-size="20" fill="#4b5563">Angular shell, typed state, inspectable retrieval, visible tools, and enterprise checkpoints.</text>

  <rect x="80" y="210" width="220" height="110" rx="20" fill="#ecfeff" stroke="#99f6e4"/>
