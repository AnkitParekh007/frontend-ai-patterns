  <rect x="920" y="210" width="200" height="110" rx="20" fill="#f5f3ff" stroke="#d8b4fe"/>
  <text x="950" y="258" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#6d28d9">Citations</text>
  <text x="950" y="286" font-family="Segoe UI, sans-serif" font-size="16" fill="#334155">grounding and</text>
  <text x="950" y="306" font-family="Segoe UI, sans-serif" font-size="16" fill="#334155">evidence</text>

