  <text x="390" y="286" font-family="Segoe UI, sans-serif" font-size="16" fill="#334155">streaming, blocked,</text>
  <text x="390" y="306" font-family="Segoe UI, sans-serif" font-size="16" fill="#334155">recovering</text>

  <rect x="640" y="210" width="220" height="110" rx="20" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="670" y="258" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#92400e">Tool timeline</text>
