  <text x="110" y="288" font-family="Segoe UI, sans-serif" font-size="16" fill="#334155">messages, sources, approvals</text>

  <rect x="360" y="210" width="220" height="110" rx="20" fill="#eff6ff" stroke="#bfdbfe"/>
