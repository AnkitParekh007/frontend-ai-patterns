  <text x="498" y="506" font-family="Segoe UI, sans-serif" font-size="15" fill="#475569">retrieval, tools,</text>
  <text x="498" y="526" font-family="Segoe UI, sans-serif" font-size="15" fill="#475569">provider, policy</text>

  <rect x="790" y="430" width="250" height="110" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="818" y="478" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Enterprise guardrails</text>
  <text x="818" y="506" font-family="Segoe UI, sans-serif" font-size="15" fill="#475569">approvals, audit,</text>
  <text x="818" y="526" font-family="Segoe UI, sans-serif" font-size="15" fill="#475569">role, tenant</text>

